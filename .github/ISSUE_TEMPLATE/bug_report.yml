name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: workout-json
    attributes:
      label: Exported workout JSON
      description: Attach or paste the exported file.
      render: json
  - type: input
    id: device
    attributes:
      label: Garmin device model
      placeholder: e.g. Fēnix 8, Forerunner 965
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 138 on Windows 11
